[project]
name = "local-agent-sft-template"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch>=2.12.0",
  "transformers>=5.11.0",
  "trl>=1.6.0",
  "peft>=0.18.0",
  "accelerate>=1.13.0",
  "datasets>=4.4.0",
  "bitsandbytes>=0.48.0",
  "trackio>=0.3.0",
  "inspect-ai",
  "inspect-evals",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"
